<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>世界杯活动 · 大使馆线下合作 · Jiho</title>
<link rel="icon" href="../../favicon.png" type="image/png">
<link rel="stylesheet" href="../../style.css">
<style>
  :root{ --mono: SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:var(--mono);overflow-x:hidden;overflow-y:auto;}
  body{overscroll-behavior-y:none;}

  /* CRT 细纹 */
  .scanlines{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0px,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px);}

  /* ===== 顶部导航（个人项目导航栏样式：返回 / 标题 / 时钟） ===== */
  .nav{position:fixed;top:0;left:0;width:100%;z-index:100;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:12px 16px;height:69px;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.25);}
  .back{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;letter-spacing:1px;}
  .back svg{width:16px;height:16px;}
  .nav-title{font-size:16px;font-weight:600;letter-spacing:2px;}
  .clock{justify-self:end;font-size:13px;opacity:.85;}

  /* ===== 项目介绍文字区 ===== */
  .intro{max-width:900px;margin:0 auto;padding:78px 24px 6px;text-align:center;}
  .intro h1{font-size:clamp(22px,4vw,34px);margin:0 0 10px;letter-spacing:2px;}
  .intro .en{font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.5);margin-bottom:14px;}
  .intro p{font-size:13px;line-height:1.9;color:rgba(255,255,255,.78);max-width:640px;margin:0 auto;}
  .intro .tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .intro .tags span{font-size:11px;padding:5px 12px;border:1px solid rgba(255,255,255,.3);border-radius:20px;color:rgba(255,255,255,.8);}

  /* ===== 3D 环形图集（CSS 3D，等效 React Bits Circular Carousel） ===== */
  .carousel-wrap{position:relative;width:100%;height:min(64vh,560px);margin-top:-64px;perspective:3200px;perspective-origin:50% 48%;overflow:hidden;
    touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;}
  .ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;
    transform:rotateX(0deg) rotateY(0deg);}
  .ring .cell{position:absolute;left:calc(var(--card-w,220px) / -2);top:calc(var(--card-h,220px) / -2);
    width:var(--card-w,220px);height:var(--card-h,220px);
    transform-style:preserve-3d;backface-visibility:hidden;cursor:pointer;
    border-radius:12px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.55);
    transition:opacity .3s ease,filter .3s ease;}
  .ring .cell img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;}
  .ring .cell .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px;text-align:center;
    font-size:11px;letter-spacing:1px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8));
    opacity:0;transition:opacity .3s;}
  .ring .cell.active .cap{opacity:1;}
  .hint{position:absolute;bottom:14px;left:0;width:100%;text-align:center;font-size:11px;
    letter-spacing:2px;color:rgba(255,255,255,.45);pointer-events:none;}

  /* 灯箱 */
  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:none;
    align-items:center;justify-content:center;padding:60px 16px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.8);}
  .lb-close{position:fixed;top:16px;right:16px;width:38px;height:38px;border:1px solid rgba(255,255,255,.5);
    background:rgba(0,0,0,.5);color:#fff;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;}
  .lb-count{position:fixed;bottom:22px;left:0;width:100%;text-align:center;font-size:12px;color:rgba(255,255,255,.7);letter-spacing:2px;}

  /* 移动端：图片一张一张往下排，不用 3D 环形 */
  .mobile-gallery{display:none;flex-direction:column;gap:12px;padding:0 14px 40px;}
  .mobile-gallery img{width:100%;height:auto;display:block;border-radius:8px;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.5);}

  @media(max-width:699px){
    .intro{padding-top:96px;padding-bottom:24px;}
    .intro .tags{margin-top:24px;}
    .carousel-wrap{display:none;}
    .mobile-gallery{display:flex;}
  }
  @media(min-width:700px){
    .nav{padding:14px 48px;height:66px;}
    .intro{padding-top:108px;}
    .carousel-wrap{height:min(74vh,640px);}
  }
</style>
</head>
<body>
<div class="scanlines"></div>

<nav class="nav">
  <a class="back" href="#" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span>返回</span></a>
  <div class="nav-title">世界杯活动</div>
  <div class="clock" id="clock"></div>
</nav>

<section class="intro">
  <h1>度小满×阿根廷大使馆2026世界杯观赛盛典</h1>
  <p>线下观赛盛典主题活动，协同完成视觉设计及现场落地，助力活动圆满举办。</p>
  <div class="tags"><span>线下活动</span><span>世界杯</span><span>大使馆合作</span><span>2026</span></div>
</section>

<section class="carousel-wrap" id="wrap">
  <div class="ring" id="ring"></div>
</section>
<section class="mobile-gallery" id="mobileGallery"></section>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">×</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
(function(){
  // 返回：优先浏览器历史，无历史则回首页
  document.getElementById('back').addEventListener('click',e=>{
    e.preventDefault();
    if(history.length>1) history.back(); else location.href='../../index.html';
  });

  // 时钟
  function tick(){const d=new Date();let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';h=h%12||12;document.getElementById('clock').textContent=`${h}:${m} ${ap}`;}
  tick(); setInterval(tick,30000);

  // 图片列表（26 张）
  const total=26;
  const imgs=Array.from({length:total},(_,i)=>({src:`${String(i+1).padStart(2,'0')}.webp`,title:`活动记录 ${String(i+1).padStart(2,'0')} / ${total}`}));

  // 移动端：图片一张一张往下排
  const mg=document.getElementById('mobileGallery');
  imgs.forEach((it,i)=>{
    const img=document.createElement('img');
    img.src=it.src; img.alt=it.title; img.loading='lazy';
    img.addEventListener('click',()=>openLB(i));
    mg.appendChild(img);
  });

  const ring=document.getElementById('ring');
  const wrap=document.getElementById('wrap');
  const cellW=200, cellH=200;
  document.documentElement.style.setProperty('--card-w',cellW+'px');
  document.documentElement.style.setProperty('--card-h',cellH+'px');

  // 圆柱半径：周长 = 数量 * (卡片宽 + 间隙)
  const gap=26;
  const radius=Math.round((total*(cellW+gap))/(2*Math.PI));
  const step=360/total;

  imgs.forEach((it,i)=>{
    const cell=document.createElement('div');
    cell.className='cell';
    cell.style.transform=`rotateY(${i*step}deg) translateZ(${radius}px)`;
    const img=document.createElement('img');
    img.src=it.src; img.alt=it.title; img.loading=(i<12?'eager':'lazy');
    const cap=document.createElement('div'); cap.className='cap'; cap.textContent=it.title;
    cell.appendChild(img); cell.appendChild(cap);
    ring.appendChild(cell);
  });
  const cells=[...ring.children];

  // 旋转状态
  let angle=0, velocity=0, autoplay=true, dragging=false, lastX=0, lastT=0;
  const AUTO_SPEED=-1.5; // 度/秒，缓慢反向旋转

  function apply(){
    ring.style.transform=`rotateX(0deg) rotateY(${angle}deg)`;
    // 判断最靠近正面的卡片（角度归一化到 [-180,180]）
    let best=0,bestAbs=1e9;
    cells.forEach((c,i)=>{
      let a=(i*step + angle)%360; if(a>180)a-=360; if(a<-180)a+=360;
      const abs=Math.abs(a);
      if(abs<bestAbs){bestAbs=abs;best=i;}
      // 远离的卡片淡出
      c.style.opacity=abs>105?'.18':abs>70?'.5':'1';
      c.style.filter=abs>105?'brightness(.35)':'none';
    });
    cells.forEach((c,i)=>c.classList.toggle('active',i===best));
  }

  // 自动旋转 + 惯性
  let last=performance.now();
  function loop(now){
    const dt=Math.min((now-last)/1000,0.05); last=now;
    if(!dragging){
      if(Math.abs(velocity)>0.01){ angle+=velocity*dt; velocity*=Math.pow(0.94,dt*60); }
      else if(autoplay){ angle+=AUTO_SPEED*dt; velocity=0; }
    }
    apply();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 拖拽 + 轻点放大
  let downX=0, downY=0, moved=0;
  function pt(e){ return e.touches&&e.touches[0] ? e.touches[0] : e; }
  function down(e){
    if(e.cancelable) e.preventDefault(); // 阻止浏览器原生图片拖拽/选中高亮
    const p=pt(e);
    dragging=true;velocity=0;lastX=p.clientX;lastT=performance.now();downX=p.clientX;downY=p.clientY;moved=0;
  }
  function move(e){
    if(!dragging)return;
    const p=pt(e);
    const dx=p.clientX-lastX;
    moved=Math.max(moved,Math.abs(p.clientX-downX)+Math.abs(p.clientY-downY));
    angle+=dx*0.08; // 降低灵敏度：拖200px约转16°（一张图）
    const now=performance.now();
    velocity=(dx*0.08)/Math.max((now-lastT)/1000,0.016);
    lastX=p.clientX; lastT=now;
  }
  function up(e){
    if(!dragging)return;
    dragging=false;
    // 轻点（移动<8px）：放大被点的卡片
    if(moved<8){
      const el=document.elementFromPoint(downX,downY);
      const cell=el&&el.closest('.cell');
      if(cell) openLB(cells.indexOf(cell));
    }
  }
  wrap.addEventListener('pointerdown',down);
  window.addEventListener('pointermove',move,{passive:true});
  window.addEventListener('pointerup',up);
  wrap.addEventListener('touchstart',down,{passive:false});
  wrap.addEventListener('touchmove',move,{passive:false});
  wrap.addEventListener('touchend',up);

  // 灯箱
  const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),lbCount=document.getElementById('lbCount');
  function openLB(i){lbImg.src=imgs[i].src;lbCount.textContent=`${i+1} / ${total}`;lb.classList.add('show');}
  function closeLB(){lb.classList.remove('show');lbImg.src='';}
  document.getElementById('lbClose').addEventListener('click',closeLB);
  lb.addEventListener('click',e=>{if(e.target===lb)closeLB();});
  window.addEventListener('keydown',e=>{
    if(!lb.classList.contains('show'))return;
    if(e.key==='Escape')closeLB();
    if(e.key==='ArrowRight'){const i=imgs.findIndex(x=>x.src===lbImg.src.replace(/^.*\//,''));openLB((i+1)%total);}
    if(e.key==='ArrowLeft'){const i=imgs.findIndex(x=>x.src===lbImg.src.replace(/^.*\//,''));openLB((i-1+total)%total);}
  });
})();
</script>
</body>
</html>
